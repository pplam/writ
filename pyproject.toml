[project]
name = "forge-agent"
version = "0.2.0"
description = "Plan, dispatch, and track coding-agent work against a design document"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
